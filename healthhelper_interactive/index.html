<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>我的病例夹 · 交互原型</title>
  <style>
    :root {
      --bg: #edeae4;
      --card: #ffffff;
      --ink: #3c3630;
      --ink-2: #7a7065;
      --ink-3: #9a9085;
      --border: #d8d4cc;
      --border-soft: #e5e1da;
      --primary: #5a7a5a;
      --primary-soft: #e3eae0;
      --high: #c07060;
      --high-soft: #f5e2dc;
      --low: #5a7aa8;
      --low-soft: #dde3ee;
      --warn: #a8682e;
      --warn-soft: #faf0e0;
      --shadow: 0 1px 8px rgba(0,0,0,.035);
      --font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; background: #f0eee9; color: var(--ink); font-family: var(--font); }
    button, input, textarea, select { font: inherit; }
    button { border: 0; cursor: pointer; }
    ::-webkit-scrollbar { display: none; }

    .stage {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(320px, 420px) minmax(280px, 1fr);
      gap: 28px;
      padding: 28px;
      align-items: start;
    }

    .phone-shell {
      width: min(100%, 390px);
      height: min(860px, calc(100vh - 56px));
      min-height: 720px;
      margin: 0 auto;
      background: #121212;
      border-radius: 44px;
      padding: 12px;
      box-shadow: 0 24px 70px rgba(0,0,0,.24);
      position: sticky;
      top: 28px;
    }

    .phone {
      height: 100%;
      border-radius: 34px;
      overflow: hidden;
      background: var(--bg);
      position: relative;
    }

    .screen {
      height: 100%;
      overflow-y: auto;
      padding-bottom: 96px;
      background: var(--bg);
      position: relative;
    }

    .screen.no-tab { padding-bottom: 22px; }
    .screen.with-bottom-action { padding-bottom: 112px; }

    .side {
      max-width: 760px;
      padding: 8px 0 40px;
    }

    .side h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: 0; }
    .side p { color: var(--ink-2); line-height: 1.8; margin: 0 0 18px; }
    .panel {
      background: rgba(255,255,255,.68);
      border: 1px solid var(--border-soft);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }
    .panel h2 { font-size: 16px; margin: 0 0 10px; }
    .jump-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .jump {
      padding: 8px 12px;
      border-radius: 12px;
      background: #fff;
      color: var(--ink-2);
      border: 1px solid var(--border-soft);
    }
    .jump.active, .jump:hover { color: var(--primary); border-color: var(--primary); background: var(--primary-soft); }
    .hint-list { margin: 8px 0 0; padding-left: 18px; color: var(--ink-2); line-height: 1.8; }

    .banner {
      min-height: 140px;
      padding: 54px 18px 18px;
      color: #fff;
      background: linear-gradient(160deg, #6b8e6b 0%, #5a7a5a 100%);
      border-bottom-left-radius: 28px;
      border-bottom-right-radius: 28px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .login-banner { min-height: 280px; align-items: center; justify-content: center; text-align: center; padding-top: 18px; border-radius: 0; }
    .app-mark {
      width: 76px; height: 76px; border-radius: 22px; margin: 0 auto 14px;
      background: rgba(255,255,255,.15);
      border: 1.5px solid rgba(255,255,255,.5);
      display: grid; place-items: center;
    }
    .nav {
      height: 76px;
      padding: 42px 16px 12px;
      background: #fff;
      border-bottom: 1px solid var(--border-soft);
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .nav-title { flex: 1; text-align: center; font-weight: 700; font-size: 17px; }
    .nav-left, .nav-right { width: 62px; color: var(--primary); font-size: 14px; background: transparent; padding: 0; display: flex; align-items: center; }
    .nav-left { color: var(--ink); }
    .nav-right { justify-content: flex-end; }
    .nav-placeholder { visibility: hidden; }

    .card {
      background: var(--card);
      border: 1px solid var(--border-soft);
      box-shadow: var(--shadow);
      border-radius: 22px;
      padding: 16px;
      overflow: hidden;
      position: relative;
    }
    .pad { padding: 14px 16px 0; }
    .section-title {
      padding: 0 16px;
      margin: 18px 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 700;
    }
    .section-title button, .section-title span.action { color: var(--primary); background: transparent; font-size: 12px; font-weight: 600; }
    .row {
      min-height: 48px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border-soft);
      background: #fff;
      width: 100%;
      color: inherit;
      text-align: left;
    }
    .row:last-child { border-bottom: 0; }
    .row:active { background: #faf8f3; }
    .muted { color: var(--ink-3); }
    .sub { color: var(--ink-2); font-size: 12px; line-height: 1.5; }
    .tiny { color: var(--ink-3); font-size: 11px; line-height: 1.5; }
    .big-number { font-size: 42px; line-height: 1; font-weight: 800; }

    .btn {
      min-height: 48px;
      border-radius: 16px;
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      font-size: 15px;
    }
    .btn.full { width: 100%; }
    .btn.secondary { background: #fff; color: var(--primary); border: 1.2px solid var(--primary); }
    .btn.ghost { background: transparent; color: var(--primary); }
    .btn.danger { background: var(--high); color: #fff; }
    .btn:disabled { background: var(--border); color: #fff; cursor: not-allowed; }

    .pill {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 22px;
      padding: 3px 8px;
      border-radius: 10px;
      background: #f2eee7;
      color: var(--ink-2);
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
    .pill.primary { background: var(--primary-soft); color: var(--primary); }
    .pill.high { background: var(--high-soft); color: var(--high); }
    .pill.low { background: var(--low-soft); color: var(--low); }
    .pill.warn { background: #f7e8d8; color: var(--warn); }

    .tabbar {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 82px;
      padding: 8px 6px 26px;
      background: #fff;
      border-top: 1px solid var(--border-soft);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      z-index: 40;
    }
    .tab {
      background: transparent;
      color: var(--ink-3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 3px;
      font-size: 10.5px;
    }
    .tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .tab.active { color: var(--primary); font-weight: 700; }

    .profile-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px 5px 5px;
      border-radius: 18px;
      background: rgba(255,255,255,.22);
      border: 1px solid rgba(255,255,255,.35);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
    }
    .avatar {
      width: 24px; height: 24px; border-radius: 50%;
      display: grid; place-items: center;
      background: rgba(255,255,255,.3);
      color: #fff;
      font-weight: 700;
      font-size: 11px;
    }
    .avatar.large { width: 50px; height: 50px; background: var(--primary); font-size: 18px; }

    .h-scroll { display: flex; gap: 10px; overflow-x: auto; padding: 0 16px 4px; }
    .metric-mini { min-width: 148px; border-radius: 18px; border: 1px solid var(--border-soft); padding: 12px; background: #fff; }
    .spark { width: 120px; height: 30px; }

    .search {
      height: 40px;
      border-radius: 14px;
      border: 1px solid var(--border-soft);
      background: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      color: var(--ink-3);
      font-size: 13px;
    }
    .seg {
      background: #e5e1da;
      border-radius: 12px;
      padding: 3px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
    }
    .seg button {
      min-height: 46px;
      border-radius: 10px;
      background: transparent;
      color: var(--ink-2);
      font-weight: 600;
      font-size: 13px;
    }
    .seg button.active { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    .seg small { display: block; font-size: 10px; color: var(--ink-3); font-weight: 400; margin-top: 2px; }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 4px; }
    .chip {
      padding: 6px 12px;
      border-radius: 14px;
      border: 1px solid var(--border-soft);
      background: #fff;
      color: var(--ink-2);
      white-space: nowrap;
      font-size: 12px;
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }
    .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .badge {
      min-width: 16px;
      padding: 0 5px;
      border-radius: 8px;
      background: var(--high);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      text-align: center;
    }
    .chip.active .badge { background: rgba(255,255,255,.3); }

    .topic-head { background: #faf8f3; border-radius: 22px 22px 0 0; font-weight: 700; }
    .metric-row .value { font-size: 17px; font-weight: 800; }
    .value.high, .high-text { color: var(--high); }
    .value.low, .low-text { color: var(--low); }

    .date-block {
      width: 42px; height: 46px; border-radius: 9px;
      background: var(--primary-soft); color: var(--primary);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      flex: 0 0 auto;
    }
    .date-block b { font-size: 16px; line-height: 1; }
    .date-block span { font-size: 9px; margin-top: 2px; }

    .chart {
      height: 180px;
      border-radius: 14px;
      background: linear-gradient(#fff, #fff), repeating-linear-gradient(to bottom, transparent 0 43px, #eee8de 44px 45px);
      position: relative;
      overflow-x: auto;
      border: 1px solid var(--border-soft);
    }
    .chart svg { min-width: 430px; height: 178px; display: block; }
    .ref-note { font-size: 10.5px; color: var(--ink-3); line-height: 1.5; margin-top: 8px; }

    .todo-check {
      width: 22px; height: 22px; border-radius: 6px;
      border: 1.5px solid var(--border);
      background: #fff;
      display: grid; place-items: center;
      flex: 0 0 auto;
    }
    .todo-check.done { background: var(--primary); border-color: var(--primary); color: #fff; }
    .todo-done { color: var(--ink-3); text-decoration: line-through; font-weight: 400; }
    .progress { height: 5px; border-radius: 3px; background: var(--border-soft); overflow: hidden; }
    .progress span { display: block; height: 100%; background: var(--primary); }

    .upload-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .upload-action {
      min-height: 112px;
      border-radius: 14px;
      border: 1.5px dashed var(--primary);
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      color: var(--ink);
      font-weight: 700;
    }
    .icon-soft { width: 38px; height: 38px; border-radius: 10px; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; }
    .photos { display: flex; flex-wrap: wrap; gap: 12px; }
    .photo {
      width: calc((100% - 24px) / 3);
      aspect-ratio: 1;
      border-radius: 12px;
      background: repeating-linear-gradient(135deg, #ece8e1 0 6px, #f5f2ec 6px 12px);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      position: relative;
      color: var(--ink-3);
      font-size: 11px;
    }
    .photo.grouped { border: 2px solid var(--primary); }
    .photo.selected { border: 2.5px solid var(--primary); }
    .group-label, .order-label {
      position: absolute;
      top: 6px;
      min-width: 22px;
      height: 22px;
      border-radius: 11px;
      background: var(--primary);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 800;
      padding: 0 6px;
    }
    .group-label { left: 6px; }
    .order-label { right: 6px; }
    .paperclip {
      position: absolute;
      right: 5px; bottom: 5px;
      width: 24px; height: 24px;
      border-radius: 12px;
      display: grid; place-items: center;
      background: rgba(255,255,255,.92);
      color: var(--ink-2);
      box-shadow: 0 1px 3px rgba(0,0,0,.15);
      font-size: 14px;
    }
    .photo.grouped .paperclip { background: var(--primary); color: #fff; }
    .add-photo { border: 1.5px dashed var(--border); background: #fff; font-size: 26px; color: var(--ink-3); }

    .bottom-action {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      padding: 12px 16px 24px;
      background: #fff;
      border-top: 1px solid var(--border-soft);
      z-index: 45;
    }
    .bottom-action.with-tab { bottom: 82px; padding-bottom: 12px; }

    .toast-card {
      border: 1.5px solid var(--primary);
      box-shadow: 0 2px 8px rgba(90,122,90,.15);
      border-radius: 14px;
      padding: 12px 14px;
      background: #fff;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .notice {
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 12.5px;
      line-height: 1.5;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .notice.warn { background: var(--warn-soft); color: var(--warn); }

    .sheet-mask {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.34);
      z-index: 70;
      display: flex;
      align-items: flex-end;
    }
    .sheet {
      width: 100%;
      background: #fff;
      border-radius: 24px 24px 0 0;
      padding: 12px 16px 26px;
      box-shadow: 0 -4px 20px rgba(0,0,0,.1);
      max-height: 80%;
      overflow-y: auto;
    }
    .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--border-soft); margin: 0 auto 14px; }
    .modal-mask {
      position: absolute;
      inset: 0;
      z-index: 90;
      background: rgba(0,0,0,.38);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .modal {
      width: 100%;
      background: #fff;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,.22);
    }

    .empty-illu {
      height: 140px;
      border-radius: 18px;
      background:
        radial-gradient(circle at 35% 36%, rgba(90,122,90,.16) 0 28px, transparent 29px),
        radial-gradient(circle at 62% 58%, rgba(192,112,96,.12) 0 24px, transparent 25px),
        repeating-linear-gradient(135deg, #ece8e1 0 6px, #f5f2ec 6px 12px);
      border: 1px dashed var(--border);
    }

    .listless { list-style: none; padding: 0; margin: 0; }
    .danger-text { color: var(--high); }

    @media (max-width: 850px) {
      .stage { grid-template-columns: 1fr; padding: 14px; gap: 18px; }
      .phone-shell { position: relative; top: 0; height: 820px; min-height: 720px; }
      .side { order: -1; }
      .side h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="phone-shell" aria-label="交互式手机预览">
      <div id="app" class="phone"></div>
    </section>
    <aside class="side">
      <h1>我的病例夹 · 可交互高保真原型</h1>
      <p>基于设计包中的线框稿、UX 文档和视觉规范还原。左侧手机可以点击：底部 Tab、上传流程、报告/指标下钻、复查待办、档案切换、弹窗和确认流程。</p>
      <div class="panel">
        <h2>快速跳转</h2>
        <div id="jumpGrid" class="jump-grid"></div>
      </div>
      <div class="panel">
        <h2>已覆盖的关键交互</h2>
        <ul class="hint-list">
          <li>首页 4 状态：登录、空数据、有数据、后台识别中。</li>
          <li>健康数据按指标/按时间切换，指标详情区分数值型与定性型。</li>
          <li>上传多图、曲别针合并、识别中、确认、编辑、冲突处理。</li>
          <li>复查 todolist、新增计划、计划详情、完成确认。</li>
          <li>多档案切换、管理、添加档案、我的档案资料。</li>
        </ul>
      </div>
    </aside>
  </main>

  <script>
    const state = {
      route: 'home',
      tab: 'home',
      healthView: 'metric',
      metricFilter: '全部',
      profileSheet: null,
      modal: null,
      uploadGrouping: false,
      uploadSelected: [1, 2],
      uploadGrouped: true,
      ocrDone: false,
      todos: [
        { text: '预约挂号', done: true },
        { text: '准备身份证和病历本', done: true },
        { text: '复查前一日清淡饮食', done: true },
        { text: '复查当天空腹', done: false },
        { text: '提前 2 小时出发', done: false },
      ],
      currentProfile: '妈妈 · 王芬',
    };

    const routes = [
      ['home', '首页'],
      ['health', '健康数据'],
      ['recheck', '复查'],
      ['profile', '我的'],
      ['uploadPick', '上传报告'],
      ['metricDetail', '指标详情'],
      ['reportDetail', '报告详情'],
      ['profileOnboard', '首次建档'],
    ];

    const $ = (sel) => document.querySelector(sel);
    const app = $('#app');

    function setRoute(route, patch = {}) {
      Object.assign(state, patch, { route });
      if (['home','health','recheck','profile'].includes(route)) state.tab = route;
      render();
    }
    function openSheet(name) { state.profileSheet = name; render(); }
    function closeSheet() { state.profileSheet = null; render(); }
    function openModal(type) { state.modal = type; render(); }
    function closeModal() { state.modal = null; render(); }
    function esc(s) { return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

    function icon(name) {
      const paths = {
        home: '<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V11z"/>',
        health: '<path d="M4 19V5"/><path d="M8 17V9"/><path d="M12 17V6"/><path d="M16 17v-4"/><path d="M20 17V8"/>',
        recheck: '<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M16 3v4M8 3v4M4 10h16"/>',
        profile: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
        plus: '<path d="M12 5v14M5 12h14"/>',
        back: '<path d="M15 18l-6-6 6-6"/>',
        arrow: '<path d="M9 18l6-6-6-6"/>',
        search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/>',
        camera: '<path d="M3 8a2 2 0 0 1 2-2h2l2-2h6l2 2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8z"/><circle cx="12" cy="13" r="4"/>',
        image: '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8" cy="10" r="2"/><path d="M21 16l-5-5-9 8"/>',
        file: '<path d="M6 3h8l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v4h4M8 13h8M8 17h6"/>',
        edit: '<path d="M3 17.25V21h3.75L18 9.75 14.25 6 3 17.25z"/><path d="M15 5l4 4"/>',
        bell: '<path d="M6 9a6 6 0 1 1 12 0v4l2 3H4l2-3V9z"/><path d="M10 19a2 2 0 0 0 4 0"/>',
        check: '<path d="M5 12l5 5 9-11"/>',
        clip: '<path d="M21.4 11.05l-9.19 9.19a6 6 0 1 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 1 1-2.83-2.83l8.49-8.48"/>',
      };
      return `<svg viewBox="0 0 24 24" aria-hidden="true">${paths[name] || ''}</svg>`;
    }

    function nav(title, opts = {}) {
      const left = opts.left === false ? '<button class="nav-left nav-placeholder"></button>' :
        `<button class="nav-left" onclick="${opts.leftAction || 'historyBack()'}">${icon('back')}<span>${opts.left || ''}</span></button>`;
      const right = opts.right ? `<button class="nav-right" onclick="${opts.rightAction || ''}">${opts.right}</button>` : '<button class="nav-right nav-placeholder"></button>';

    function spark(data, abnormal) {
      const w = 120, h = 30, min = Math.min(...data), max = Math.max(...data), range = max - min || 1;
      const pts = data.map((v, i) => {
        const x = 2 + i * ((w - 4) / (data.length - 1));
        const y = h - 4 - ((v - min) / range) * (h - 8);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');
      const last = data[data.length - 1];
      const lastY = h - 4 - ((last - min) / range) * (h - 8);
      const c = abnormal ? 'var(--high)' : 'var(--primary)';
      return `<svg class="spark" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${w-2}" cy="${lastY}" r="2.5" fill="${c}"/></svg>`;
    }

      const copy = {
        search: ['搜索暂未开放', 'v1.0 可以先保留入口，后续支持搜索指标、报告和医院。'],
        fold: ['折叠分组', '这里会在原地展开或收起该主题。'],
        more: ['展开剩余指标', '完整实现时会在当前卡片内展开剩余指标行。'],
        pin: ['已收藏到关注指标', '该指标会出现在首页“关注指标”横滑区。'],
        editReport: ['进入编辑态', '报告详情页会原地切换为可编辑字段，便于修正 OCR。'],
        deleteReport: ['删除报告？', '报告将软删除，30 天后物理删除。'],
        addTodo: ['添加待办', '这里会弹出底部输入框，新增一条自定义待办。'],
        finishRecheck: ['标记为已完成？', '计划状态将变为 done，并移入“已完成”折叠区。'],
        doneList: ['已完成复查', '这里会展开历史复查列表。'],
        picker: ['选择器', '在小程序中会使用 picker 或底部 chip 选择器。'],
        clearData: ['清空当前档案数据？', '这是危险操作，正式版需要二次确认。'],
        guide: ['使用指南', '正式版建议用 webview 加载 H5 内容，便于运营更新。'],
        feedback: ['意见反馈', '这里会进入反馈表单。'],
        about: ['关于我们', '我的病例夹 · 公益免费 · v1.0.0'],
        field: ['编辑字段', '这里会弹出输入框、日期选择器或 chip 选择器。'],
        med: ['用药记录', '可新增或编辑药名、剂量、频次和起始日期。'],
        camera: ['调用相机', '小程序中使用 wx.chooseMedia({ sourceType: [camera] })。'],
        album: ['打开相册', '小程序中使用 wx.chooseMedia({ count: 9, sourceType: [album] })。'],
        preview: ['图片预览', '小程序中使用 wx.previewImage。'],
        split: ['拆分页面', '会取消该报告内的多页合并，重新拆成独立报告。'],
        saveReports: ['已保存 3 份报告', '保存后会跳转到健康数据的按时间视图。'],
        addMetric: ['添加指标', '这里会打开指标选择器，支持搜索和新增未知指标。'],
        chooseConflict: ['已选择该值', '冲突处理会记录保留值，回到确认页后允许保存。'],
        deleteMetric: ['删除此项？', '该冲突指标不会保存到报告中。'],
        cancelRecheck: ['取消此次复查？', '计划状态将变为 cancelled。'],
        deleteRecheck: ['删除此计划？', '删除后无法在主页列表中看到。'],
        selectAll: ['全选待办', '可以批量选择或取消默认待办模板。'],
      }[state.modal] || ['提示', '交互占位'];
      return `<div class="modal-mask" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()"><h3 style="margin:0 0 8px">${copy[0]}</h3><p class="sub" style="margin:0 0 18px">${copy[1]}</p><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn secondary" onclick="closeModal()">取消</button><button class="btn" onclick="${state.modal==='saveReports' ? "closeModal();setRoute('health',{healthView:'time'})" : "closeModal()"}">确定</button></div></div></div>`;
    }

    function renderJumps() {
      const grid = $('#jumpGrid');
      grid.innerHTML = routes.map(([r,l]) => `<button class="jump ${state.route===r?'active':''}" onclick="setRoute('${r}')">${l}</button>`).join('');
    }

    function render() {
      app.innerHTML = activeScreen() + sheetHtml() + modalHtml();
      renderJumps();
    }

    Object.assign(window, { setRoute, openSheet, closeSheet, openModal, closeModal, state, render });
    render();
  </script>
</body>
</html>
